name: Todo App CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Flake8
        run: |
          flake8 app tests

      - name: Run unit tests
        env:
          PYTHONPATH: app
        run: |
          python -m pytest -q -p no:cacheprovider tests

      - name: Build Docker image
        run: |
          docker build -t jayvaisakh/todo-app:test .

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag jayvaisakh/todo-app:test jayvaisakh/todo-app:latest
          docker push jayvaisakh/todo-app:latest

      - name: Push version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker tag jayvaisakh/todo-app:test jayvaisakh/todo-app:${VERSION}
          docker push jayvaisakh/todo-app:${VERSION}
