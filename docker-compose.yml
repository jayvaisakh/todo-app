version: "2.4"

services:
  mysql:
    image: mysql:8.0
    container_name: todo-mysql
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-app
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - todo-network
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: todo-nginx
    depends_on:
      - app
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - todo-network

volumes:
  mysql_data:

networks:
  todo-network:
    driver: bridge
